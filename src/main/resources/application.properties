spring.application.name=orbitlab-backend
server.port=${PORT:8080}
spring.datasource.url=${ORBITLAB_DB_URL:jdbc:mysql://localhost:3306/orbitlab?createDatabaseIfNotExist=false}
spring.datasource.username=${ORBITLAB_DB_USERNAME:root}
spring.datasource.password=${ORBITLAB_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
